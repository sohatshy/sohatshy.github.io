<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{if(localStorage.getItem("lang")==="en"){document.documentElement.lang="en";document.documentElement.dir="ltr"}}catch(e){}</script>
  <title>سوهاتشي · Sohatshy — ترجمات عربية مجانية للألعاب</title>
  <meta name="description" content="ألعابك المفضلة بالعربية. ترجمات عربية مجانية وغير رسمية للألعاب، مع شرح التثبيت خطوة بخطوة. Free Arabic game translation mods.">
  <meta name="theme-color" content="#080d1c">
  <link rel="canonical" href="{{BASE_URL}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="سوهاتشي · Sohatshy">
  <meta property="og:title" content="سوهاتشي · Sohatshy — ترجمات عربية مجانية للألعاب">
  <meta property="og:description" content="ألعابك المفضلة، بالعربية. ترجمات مجانية يصنعها لاعب للاعبين.">
  <meta property="og:url" content="{{BASE_URL}}">
  <meta property="og:image" content="{{BASE_URL}}assets/img/og-default.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ar_AR">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="home">
  <header id="site-header" class="site-header"></header>

  <main id="main" data-needs-data>
    <!-- Hero: background is filled with screenshots from games.json -->
    <section class="hero">
      <!-- Hero background: pure CSS + SVG, no images. One 280×280 tile of faint
           Arabic letters and game icons repeats and drifts slowly. -->
      <div class="hero-bg" aria-hidden="true">
        <div class="hero-glow"></div>
        <div class="hero-glow hero-glow--small"></div>
        <svg class="hero-pattern" xmlns="http://www.w3.org/2000/svg" focusable="false">
          <defs>
            <pattern id="hero-tile" width="280" height="280" patternUnits="userSpaceOnUse">
              <g class="hp-letters">
                <text x="150" y="80">ض</text>
                <text x="44" y="172">ع</text>
                <text x="238" y="160">ك</text>
                <text x="156" y="258">ب</text>
              </g>
              <g class="hp-icons">
                <!-- game controller -->
                <g transform="translate(18 26)">
                  <path d="M12 4h28c6 0 10 4 11.5 10l3 13c1.2 5.5-3.4 9-8 6.5L39 28H13l-7.5 5.5C.9 36 -3.7 32.5-2.5 27l3-13C2 8 6 4 12 4z"/>
                  <path d="M13 13v9M8.5 17.5h9"/>
                  <circle cx="36" cy="14.5" r="1.8"/><circle cx="41.5" cy="19.5" r="1.8"/>
                </g>
                <!-- sword -->
                <g transform="translate(224 16) rotate(40 14 30)">
                  <path d="M14 0l4 6v34h-8V6z"/><path d="M4 40h20M14 40v12"/><circle cx="14" cy="55" r="2.5"/>
                </g>
                <!-- shield -->
                <g transform="translate(112 124)">
                  <path d="M22 2l18 6v14c0 12-8 20-18 24C12 42 4 34 4 22V8z"/><path d="M22 10v28M12 21h20"/>
                </g>
                <!-- cards -->
                <g transform="translate(24 204)">
                  <rect x="0" y="6" width="26" height="36" rx="3" transform="rotate(-12 13 24)"/>
                  <rect x="14" y="2" width="26" height="36" rx="3" transform="rotate(10 27 20)"/>
                  <path d="M27 14l4 6-4 6-4-6z"/>
                </g>
                <!-- small sparks -->
                <path d="M96 104l4 4-4 4-4-4z"/><path d="M214 214l3 3-3 3-3-3z"/><path d="M246 236v14M239 243h14"/>
              </g>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#hero-tile)"/>
        </svg>
      </div>
      <div class="container">
        <div class="hero-content">
          <span class="eyebrow rise">Arabic game translations</span>
          <h1 class="rise">سوهاتشي<span class="latin">SOHATSHY</span></h1>
          <p class="hero-lead rise" data-i18n="hero.lead"></p>
          <div class="hero-actions rise">
            <a class="btn btn-gold cut" href="#all"><span data-i18n="hero.browse"></span></a>
            <a class="btn btn-ghost cut" href="install.html"><span data-i18n="hero.howto"></span></a>
          </div>
          <div class="hero-stats rise" id="hero-stats"></div>
        </div>
      </div>
    </section>

    <!-- Most popular -->
    <section class="section" id="popular-section">
      <div class="container">
        <div class="section-head reveal">
          <div>
            <span class="eyebrow">Top picks</span>
            <h2 class="section-title" data-i18n="popular.title"></h2>
            <p class="section-sub" data-i18n="popular.sub"></p>
          </div>
          <div class="rail-arrows">
            <button class="icon-btn" type="button" id="rail-prev" data-i18n-aria="rail.prev"></button>
            <button class="icon-btn" type="button" id="rail-next" data-i18n-aria="rail.next"></button>
          </div>
        </div>
        <div class="rail-wrap reveal"><div class="rail" id="popular-rail"></div></div>
      </div>
    </section>

    <!-- All translations -->
    <section class="section" id="all">
      <div class="container">
        <div class="section-head reveal">
          <div>
            <span class="eyebrow">Library</span>
            <h2 class="section-title" data-i18n="all.title"></h2>
            <p class="section-sub" data-i18n="all.sub"></p>
          </div>
        </div>
        <div class="toolbar reveal">
          <label class="search">
            <span class="sr-only" data-i18n="all.search"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="search" data-i18n-placeholder="all.search" autocomplete="off">
          </label>
          <div class="chips" id="filters" role="group"></div>
        </div>
        <div class="grid" id="grid" aria-live="polite"></div>
      </div>
    </section>

    <!-- Coming soon -->
    <section class="section" id="soon">
      <div class="container">
        <div class="section-head reveal">
          <div>
            <span class="eyebrow">On the way</span>
            <h2 class="section-title" data-i18n="soon.title"></h2>
            <p class="section-sub" data-i18n="soon.sub"></p>
          </div>
        </div>
        <div id="soon-list"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/i18n.js" defer></script>
  <script src="assets/js/core.js" defer></script>
  <script src="assets/js/home.js" defer></script>
</body>
</html>
